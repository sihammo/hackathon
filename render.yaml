services:
  # Unified Slamtek Service (Frontend Web + Backend API together in one single deploy)
  - type: web
    name: slamtek
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --no-frozen-lockfile --filter @workspace/api-server... && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://postgres.taobdejnduuytijvflip:DendaneZaid30%40@aws-1-eu-west-3.pooler.supabase.com:6543/postgres
      - key: MONGODB_URI
        sync: false
