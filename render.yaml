services:
  # 1. API Server Backend (Node.js Express)
  - type: web
    name: slamtek-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --filter @workspace/api-server... && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # 2. Slamtek Web Application (Flutter Frontend)
  - type: web
    name: slamtek-web
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: echo "Slamtek Web Ready"
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
