services:
  # Unified Slamtek Service (Frontend Web + Backend API together in one single deploy)
  - type: web
    name: slamtek
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --filter @workspace/api-server... && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
