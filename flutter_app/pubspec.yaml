name: solvex_alert
description: "SolveX Alert — road accident emergency alert app (Flutter + Firebase + ESP32 BLE)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Device / platform
  flutter_blue_plus: ^1.35.5   # keep on 1.x (2.x changed the connect() API)
  geolocator: ^13.0.0
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  audioplayers: ^6.5.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  http: ^1.2.2

  # UI
  provider: ^6.1.5
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
